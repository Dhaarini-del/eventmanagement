<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #442200, #331100);
            color: #fff;
        }
        header {
            background-image: url('{{ url_for("static", filename="banner.jpg") }}');
            background-size: cover;
            padding: 40px;
            text-align: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav a {
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            transition: background 0.3s;
        }
        nav a:hover {
            background-color: #555;
        }
        .container {
            padding: 30px;
        }
        h2 {
            border-bottom: 2px solid orange;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .content-box {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(255, 140, 0, 0.5);
        }
    </style>
</head>
<body>
    <header>
        EVENT MANAGEMENT SYSTEM
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/add_event">Book an Event</a>
        <a href="#">Booking Status</a>
        <a href="#">Booking History</a>
        <a href="#">Feedback</a>
        <a href="#">View Venues</a>
        <a href="#">Logout</a>
    </nav>

    <div class="container">
        <h2>{{ title }}</h2>
        <div class="content-box">
            {% block content %}
            <p>This is a placeholder for {{ title }}. Replace with your actual data or forms.</p>
            {% endblock %}
        </div>
    </div>
</body>
</html>
