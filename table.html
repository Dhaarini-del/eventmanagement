{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">{{ title }}</h2>
    {% if rows %}
    <table class="table table-bordered table-hover shadow">
        <thead class="table-dark">
            <tr>
                {% for c in cols %}
                <th>{{ c.replace('_', ' ') }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in rows %}
            <tr>
                {% for c in cols %}
                <td>{{ row[c] }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p class="text-center text-muted">No data available.</p>
    {% endif %}
</div>
{% endblock %}
