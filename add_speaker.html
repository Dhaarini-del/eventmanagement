{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Add Speaker</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Speaker Name</label>
            <input type="text" class="form-control" name="speaker_name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Bio</label>
            <textarea class="form-control" name="bio" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Speaker</button>
    </form>
</div>
{% endblock %}
